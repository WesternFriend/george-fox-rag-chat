[tools]
python = "3.14"
uv = "latest"

[env]
_.file = ".env"

[tasks.langflow]
description = "Start the local Langflow server, with vars from .env (OPENAI_API_KEY, LANGFLOW_DEACTIVATE_TRACING, DO_NOT_TRACK)"
run = "uv run langflow run"

[tasks.ingest]
description = "Chunk and embed texts/ into the Chroma quaker_texts collection"
run = "uv run python -m ingestion.main"
