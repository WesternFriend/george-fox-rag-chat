# Per-file metadata used to attribute ingested chunks to a title and
# author(s), keyed by filename relative to texts/.
#
# `origin` here means where the text came from (e.g. a website or archive) —
# not to be confused with the `source` field ingestion writes on every chunk
# in Chroma, which is always the file's own relative path within texts/.
#
# `license` records why the file is allowed to be committed at all — confirm
# this (e.g. "Public Domain") before adding a new file's allowlist entry to
# .gitignore.

