[project]
name = "george-fox-rag-chat"
version = "0.1.0"
description = "RAG chat application for George Fox's writings and Quaker history/practice"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.1",
    "gunicorn>=22.0.0",
    "chromadb>=0.5.3",
    "onnxruntime>=1.18.1",
    "posthog>=3.5.0",
    "openai>=1.35.7",
    "pydantic>=2.7.4",
    "python-dotenv>=1.0.1",
    "markdown2>=2.4.13",
    "httpx>=0.27.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.7",
    "slowapi>=0.1.10",
    "itsdangerous>=2.2.0",
    "boto3>=1.35.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2.2",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0.0",
    "beautifulsoup4>=4.12.3",
    "mypy>=2.3.0",
    "types-pyyaml>=6.0.12.20260724",
]
ingestion = [
    "langchain-text-splitters>=1.1.2",
    "pyyaml>=6.0.3",
]

[tool.mypy]
plugins = ["pydantic.mypy"]

[tool.uv]
default-groups = ["dev", "ingestion"]
